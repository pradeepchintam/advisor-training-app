services:
  backend:
    build:
      context: ../backend
    image: trajan-advisor-backend:prod
    container_name: trajan-advisor-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Must be absolute — pptx_service builds file:// URIs against this, and
      # relative paths cause libreoffice to silently hang during conversion.
      RECORDINGS_DIR: /app/recordings
      S3_BUCKET: ${S3_BUCKET}
      # Used by transcription_service.py (AWS Transcribe staging) and
      # vision_service.py. Defaults blank so a missing SSM param degrades to
      # "no re-transcription / no vision pass" instead of crashing.
      ANALYSIS_S3_BUCKET: ${ANALYSIS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION}
      # When running on EC2 with an instance role, AWS SDK picks up creds automatically.
      # For non-EC2 (e.g. local prod test), pass AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # ElevenLabs Flash v2.5 streaming — the ONLY TTS path. Aura-2 and
      # Polly fallbacks were removed; if this key is missing, sessions
      # surface a 502 rather than silently degrading.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      # Persistent storage for presentation slides + the original .pptx files.
      # Session recordings still go to S3 via storage_service.
      - recordings_data:/app/recordings
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    image: trajan-advisor-caddy:prod
    container_name: trajan-advisor-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  recordings_data:
