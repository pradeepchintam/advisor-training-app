version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: trajan_db
    environment:
      POSTGRES_DB: trajan_training
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: trajan_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/trajan_training
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-min-32-chars}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      RECORDINGS_DIR: /app/recordings
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@trajanwealth.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-TempAdmin123!}
    ports:
      - "8081:8000"
    volumes:
      - recordings_data:/app/recordings
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: trajan_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
  recordings_data:
